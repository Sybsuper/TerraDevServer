on:
  push:
    tags:
      - v*
name: Auto Release
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get version names
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Create Release
        run: |
          if [[ "${TAG}" == *-alpha* || "${TAG}" == *-beta* || "${TAG}" == *-dev* ]]; then
            gh release create ${{ env.TAG }} --generate-notes --prerelease
          else
            gh release create ${{ env.TAG }} --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.0
      - name: Build with Gradle
        run: gradle build -Pversion=${{ env.VERSION }} --no-daemon
      - name: Upload Release Assets
        run: |
          gh release upload ${{ env.TAG }} build/libs/TerraDevServer-${{ env.VERSION }}-all.jar
        env:
          GH_TOKEN: ${{ github.token }}