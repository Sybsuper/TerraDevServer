on: push
name: Build
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.0
      - name: Set version for dev build
        run: echo "VERSION=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Build with Gradle
        run: gradle build -Pversion=$VERSION --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TerraDevServer-${{ env.VERSION }}-all.jar
          path: 'build/libs/TerraDevServer-${{ env.VERSION }}-all.jar'